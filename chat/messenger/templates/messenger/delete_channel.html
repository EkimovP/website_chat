{% extends 'base.html' %}

{% block content %}
    <div class="container-card">
        <div class="card">
            <h1 class="text-center mb-4">{{ title }}</h1>
            <p class="text-center">
                Вы уверены, что хотите удалить канал "{{ channel.name }}"? Это действие нельзя отменить.
            </p>
            <form class="row g-3" method="post">
                {% csrf_token %}
                <div class="d-grid col-12">
                    <button type="submit" class="btn btn-danger">Удалить</button>
                </div>
                <div class="d-grid col-12 mt-2">
                    <a href="{% url 'chat' channel.slug %}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
