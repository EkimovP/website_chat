{% extends 'base.html' %}

{% block content %}
    <div class="container-card">
        <div class="card">
            <h1 class="text-center mb-4">{{ title }}</h1>
            <form class="row g-3"
                  action="
                  {% if form.instance.pk %}{% url 'update_channel' form.instance.slug %}
                  {% else %}{% url 'add_channel' %}{% endif %}"
                  method="post">
                {% csrf_token %}

                {% if form.non_field_errors %}
                    <div class="form-error text-danger mt-1">
                        {{ form.non_field_errors }}
                    </div>
                {% endif %}

                {% for f in form %}
                    <div class="col-12 form-group {% if f.errors %}has-error{% endif %}">
                        <label class="form-label" for="{{ f.id_for_label }}">{{f.label}}: </label>
                        {{ f }}
                        {% if f.errors %}
                            <div class="form-error text-danger mt-1">
                                {{ f.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="d-grid col-12">
                    <button type="submit" class="btn btn-dark">
                        {% if form.instance.pk %}Обновить{% else %}Добавить{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Подключение Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/i18n/ru.js"></script>
    <script>
        $(document).ready(function() {
            $('.select2-users').select2({
                placeholder: 'Выберите участников',
                allowClear: true,
                width: '100%',
                language: 'ru',
                ajax: {
                    url: '{% url "user_search" %}',
                    dataType: 'json',
                    delay: 250,
                    data: function(params) {
                        return { q: params.term };
                    },
                    processResults: function(data) {
                        return { results: data.results };
                    },
                },
                minimumInputLength: 1
            });
        });
    </script>
{% endblock %}
