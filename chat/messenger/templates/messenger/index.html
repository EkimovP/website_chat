{% extends 'base.html' %}

{% block content %}
    <div class="text-center">
        <h1>Добро пожаловать!</h1>
        <p>Текущая дата: {% now "jS F Y" %}</p>
        <p>Текущее время: {% now "H:i" %}</p>
        <p>Выберите канал из списка или создайте новый.</p>
        <a href="{% url 'channels' %}" class="btn btn-outline-dark">Перейти к каналам</a>
        <a href="{% url 'add_channel' %}" class="btn btn-outline-dark">Создать новый канал</a>
    </div>
{% endblock %}
